# Use with: docker compose -f compose.yaml -f compose.production.yaml up -d --build
services:
  app:
    environment:
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN to your real DNS hostname}
      RESEND_API_KEY: ${RESEND_API_KEY:?Configure email delivery before launch}
      MAIL_FROM: ${MAIL_FROM:?Use a verified sender domain}
      TURN_URL: ${TURN_URL:?Configure your TURN relay URL}
      TURN_SECRET: ${TURN_SECRET:?Use the shared TURN REST authentication secret}
    networks: [private, edge]
  mongo:
    networks: [private]
  proxy:
    image: caddy:2.10.2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [edge]
    restart: unless-stopped
networks:
  private:
    internal: true
  edge:
volumes:
  caddy-data:
  caddy-config:
