services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&serverSelectionTimeoutMS=5000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
      APP_ENV: development
      MAIL_MODE: ${MAIL_MODE:-mailpit}
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILBOX_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - tranquil-mail:/data
    restart: unless-stopped
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - tranquil-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (!db.hello().isWritablePrimary) { rs.status(); quit(1); } } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1); }"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  tranquil-data:
  tranquil-mail:

