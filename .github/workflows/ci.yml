name: Build and test Tranquil Talk
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/core_test.cpp -o /tmp/core_test && /tmp/core_test
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Cache compiled dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dependencies
          cache-from: type=gha,scope=dependencies
          cache-to: type=gha,scope=dependencies,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tranquil-test:ci
          cache-from: |
            type=gha
            type=gha,scope=dependencies
          cache-to: type=gha,mode=max
      - name: Start MongoDB and the real backend
        run: |
          docker network create tranquil-test
          docker run -d --name mongo --network tranquil-test mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})"
          for i in $(seq 1 40); do
            if docker exec mongo mongosh --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker run -d --name app --network tranquil-test -p 8080:8080 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e 'MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0&serverSelectionTimeoutMS=5000' tranquil-test:ci
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8080/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
      - run: npm run test:integration
        id: api-checks
        continue-on-error: true
      - name: Start isolated profile verification test process
        run: |
          docker run -d --name profiles-app --network tranquil-test -p 8081:8080 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e 'MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0&serverSelectionTimeoutMS=5000' tranquil-test:ci
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8081/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8081/ >/dev/null
      - name: Test profile submission and administrator verification
        id: expert-checks
        continue-on-error: true
        env:
          TEST_ADMIN_CONTAINER: profiles-app
          TEST_PROFILES_BASE_URL: http://127.0.0.1:8081
        run: npm run test:experts
      - name: Test real browser calls with emulated devices
        id: call-checks
        continue-on-error: true
        env:
          TEST_BASE_URL: http://127.0.0.1:8083
          TEST_MONGO_CONTAINER: mongo
        run: |
          docker run -d --name call-app --network tranquil-test -p 8083:8080 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e 'MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0&serverSelectionTimeoutMS=5000' tranquil-test:ci
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8083/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8083/ >/dev/null
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.integration.config.cjs
      - name: Start isolated booking and account test process
        run: |
          docker run -d --name workflow-app --network tranquil-test -p 8082:8080 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e 'MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0&serverSelectionTimeoutMS=5000' \
            -e MAIL_MODE=outbox -e APP_BASE_URL=http://localhost:8080 \
            -e TURN_URL=turn:turn.test.invalid:3478 -e TURN_SECRET=ci-test-turn-secret tranquil-test:ci
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8082/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8082/ >/dev/null
      - name: Test booking races, room access, recovery and moderation
        id: workflow-checks
        continue-on-error: true
        env:
          TEST_MONGO_CONTAINER: mongo
        run: npm run test:workflows
      - name: Start local mail delivery and operations test process
        run: |
          docker run -d --name mailpit --network tranquil-test -p 127.0.0.1:8025:8025 axllent/mailpit:v1.33.1
          docker run -d --name operations-app --network tranquil-test -p 8084:8080 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e 'MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0&serverSelectionTimeoutMS=5000' \
            -e APP_ENV=development -e MAIL_MODE=mailpit -e MAILPIT_URL=http://mailpit:8025 \
            -e APP_BASE_URL=http://localhost:8084 tranquil-test:ci
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8084/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8084/api/health
          JWT_SECRET=temporary-compose-validation-secret docker compose config --quiet
          JWT_SECRET=temporary-compose-validation-secret DOMAIN=example.com RESEND_API_KEY=test MAIL_FROM=noreply@example.com TURN_URL=turn:example.com TURN_SECRET=test \
            docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Test real email delivery and authorised clinic/event management
        id: operations-checks
        continue-on-error: true
        env:
          TEST_MONGO_CONTAINER: mongo
          TEST_ADMIN_CONTAINER: operations-app
        run: npm run test:operations
      - name: Production must reject development email modes
        run: |
          if docker run --rm --network tranquil-test -e JWT_SECRET=ci-production-guard-key-at-least-32-characters \
            -e APP_ENV=production -e MAIL_MODE=mailpit -e MAILPIT_URL=http://mailpit:8025 \
            -e APP_BASE_URL=https://example.com tranquil-test:ci; then
            echo "Production incorrectly accepted development mail"
            exit 1
          fi
      - name: Enforce API integration result
        if: always() && (steps.api-checks.outcome != 'success' || steps.expert-checks.outcome != 'success' || steps.call-checks.outcome != 'success' || steps.workflow-checks.outcome != 'success' || steps.operations-checks.outcome != 'success')
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: call-test-failures
          path: test-results
      - name: Logs on failure
        if: failure()
        run: |
          docker logs app || true
          docker logs profiles-app || true
          docker logs workflow-app || true
          docker logs call-app || true
          docker logs operations-app || true
          docker logs mailpit || true
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-webengine-dev
      - run: cmake -S frontend -B /tmp/desktop && cmake --build /tmp/desktop -j2
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
