name: Build and test Tranquil Talk
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/core_test.cpp -o /tmp/core_test && /tmp/core_test
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Cache compiled dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dependencies
          cache-from: type=gha,scope=dependencies
          cache-to: type=gha,scope=dependencies,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tranquil-test:ci
          cache-from: |
            type=gha
            type=gha,scope=dependencies
          cache-to: type=gha,mode=max
      - name: Start MongoDB and the real backend
        run: |
          docker network create tranquil-test
          docker run -d --name mongo --network tranquil-test mongo:7.0
          for i in $(seq 1 40); do
            if docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker run -d --name app --network tranquil-test -p 8080:8080 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e 'MONGODB_URI=mongodb://mongo:27017/?serverSelectionTimeoutMS=5000' tranquil-test:ci
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8080/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
      - run: npm run test:integration
      - name: Logs on failure
        if: failure()
        run: docker logs app || true
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-webengine-dev
      - run: cmake -S frontend -B /tmp/desktop && cmake --build /tmp/desktop -j2
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
